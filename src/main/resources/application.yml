spring:
  application:
    name: boardProject_kt

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: none
    generate-ddl: off
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/boardProject?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: dm1234

  data:
    redis:
      port: 6379
      host: localhost

  config:
    import:
      - classpath:secret.yml
      - classpath:jwt-redis.yml
      - classpath:jwt-token.yml
      - classpath:cookie.yml

server:
  port: 8080

logging:
  file:
    path: logback-spring